<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZ Server Manager - Sandbox Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script> <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'pz-green': '#5d9241', 'pz-dark': '#1e293b' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-pz-green">Sandbox Editor</h1>
            <p class="text-gray-400">Edit pzserver_SandboxVars.lua</p>
        </header>

        <div class="flex border-b border-gray-700 mb-6">
            <a href="/" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 border-gray-700 text-gray-400 hover:text-gray-300">Server Details</a>
            <a href="/mods" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 border-gray-700 text-gray-400 hover:text-gray-300">Mod Management</a>
            <button class="flex-1 py-3 text-center text-lg font-semibold border-b-2 border-pz-green text-pz-green">Sandbox Settings</button>
        </div>

        <div id="message-panel" class="mb-4 p-3 rounded-lg text-sm hidden"></div>

        <div class="flex justify-end mb-4 space-x-3">
             <button onclick="fetchSandboxSettings()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded flex items-center">
                <i data-lucide="rotate-cw" class="w-4 h-4 mr-2"></i> Refresh
            </button>
            <button onclick="saveSandboxSettings()" class="bg-pz-green hover:bg-green-700 text-white font-bold py-2 px-4 rounded flex items-center shadow-lg">
                <i data-lucide="save" class="w-4 h-4 mr-2"></i> Save Changes
            </button>
        </div>

        <div id="sandbox-container" class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 space-y-6">
            <p class="text-center text-gray-500 py-10">Loading settings...</p>
        </div>
    </div>

    <script>
        // In-page script to trigger load
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) lucide.createIcons();
            fetchSandboxSettings();
        });
    </script>
</body>
</html>
