<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PZ Server Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'pz-green': '#5d9241', 'pz-dark': '#1e293b' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Common JS -->
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block scripts %}{% endblock %}
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-pz-green drop-shadow-lg">
                {% block header_title %}PZ Server Manager{% endblock %}
            </h1>
            <p class="text-gray-400 mt-2">Remote Control for Project Zomboid (LinuxGSM)</p>
        </header>

        <!-- Navigation -->
        <div class="flex border-b border-gray-700 mb-6">
            <a href="{{ url_for('frontend.serve_dashboard') }}" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 
                      {% if request.endpoint == 'frontend.serve_dashboard' %}border-pz-green text-pz-green{% else %}border-gray-700 text-gray-400 hover:text-gray-300{% endif %} 
                      transition-colors">
                Server Details
            </a>
            <a href="{{ url_for('frontend.serve_mods') }}" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 
                      {% if request.endpoint == 'frontend.serve_mods' %}border-pz-green text-pz-green{% else %}border-gray-700 text-gray-400 hover:text-gray-300{% endif %}
                      transition-colors">
                Mod Management
            </a>
            <a href="{{ url_for('frontend.serve_sandbox') }}" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 
                      {% if request.endpoint == 'frontend.serve_sandbox' %}border-pz-green text-pz-green{% else %}border-gray-700 text-gray-400 hover:text-gray-300{% endif %}
                      transition-colors">
                Sandbox Settings
            </a>
            <a href="{{ url_for('frontend.serve_config') }}" class="flex-1 py-3 text-center text-lg font-semibold border-b-2 
                      {% if request.endpoint == 'frontend.serve_config' %}border-pz-green text-pz-green{% else %}border-gray-700 text-gray-400 hover:text-gray-300{% endif %}
                      transition-colors">
                INI Config
            </a>
        </div>

        <!-- Global Message Panel -->
        <div id="message-panel" class="mb-4 p-3 rounded-lg text-sm hidden"></div>

        {% block content %}{% endblock %}

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) lucide.createIcons();
            {% block dom_ready %} {% endblock %}
        });
    </script>
</body>

</html>
