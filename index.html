<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZ Server Manager</title>
    <style>
        /* This is a simple placeholder to make Tailwind classes work if you don't have a build step */
        @import url('https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css');
        
        /* Custom color definitions if needed, otherwise rely on Tailwind defaults */
        .text-pz-green {
            color: #4ade80; /* A nice bright green */
        }
    </style>
    <style>
        /* Custom styles for the dark background */
        body {
            background-color: #1f2937; /* Gray-800 equivalent or slightly darker */
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-pz-green drop-shadow-lg">
                PZ Server Manager
            </h1>
            <p class="text-gray-400 mt-2">Remote Control for Project Zomboid (LinuxGSM)</p>
        </header>

        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl mb-8 border border-gray-700">
            <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0 md:space-x-4">
                
                <div class="flex items-center space-x-3 w-full md:w-auto justify-center md:justify-start">
                    <span id="server-status" class="px-4 py-2 rounded-full text-sm font-semibold transition-colors duration-300 shadow-md bg-red-600 text-white">
                        <span id="status-icon" class="inline-block mr-2"></span>
                        <span id="status-text">OFF</span>
                    </span>
                    <button onclick="fetchDetails()" class="p-2 text-gray-400 hover:text-pz-green transition duration-200" title="Refresh Status">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="rotate-cw" class="lucide lucide-rotate-cw w-5 h-5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    </button>
                </div>
                
                <div class="flex space-x-3 w-full justify-center md:justify-end md:w-auto">
                    <button id="start-btn" onclick="controlServer('start')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-300 flex items-center disabled:opacity-50">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="play" class="lucide lucide-play w-5 h-5 mr-2"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg> Start
                    </button>
                    <button id="stop-btn" onclick="controlServer('stop')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-300 flex items-center disabled:opacity-50">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="square" class="lucide lucide-square w-5 h-5 mr-2"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg> Stop
                    </button>
                    <button id="restart-btn" onclick="controlServer('restart')" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-300 flex items-center disabled:opacity-50">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="refresh-cw" class="lucide lucide-refresh-cw w-5 h-5 mr-2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg> Restart
                    </button>
                </div>
            </div>
            
            <div id="message-panel" class="mt-4 p-3 rounded-lg text-sm hidden"></div>
            
            <div id="loading-indicator" class="mt-4 p-3 bg-blue-900/50 rounded-lg text-sm text-blue-300 flex items-center justify-center hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="loader-2" class="lucide lucide-loader-2 w-4 h-4 mr-2 animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Processing command...
            </div>
        </div>
        
        <h2 class="text-2xl font-bold mb-4 text-gray-300">Server Details</h2>
        <div id="details-output" class="bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 h-[60vh] overflow-y-auto">
            <p class="text-gray-400">Loading details...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // Fetch status immediately when the page loads
            fetchDetails(); 
        });

        // --- Global Utility Functions ---

        function setActionLoading(action, isLoading) {
            const btn = document.getElementById(`${action}-btn`);
            const loadingIndicator = document.getElementById('loading-indicator');
            const controlButtons = document.querySelectorAll('.flex.space-x-3 button');

            if (isLoading) {
                // Disable all control buttons
                controlButtons.forEach(button => button.disabled = true);
                
                // Set indicator text
                loadingIndicator.textContent = `Processing '${action}' command...`;
                loadingIndicator.classList.remove('hidden');

            } else {
                // Enable all control buttons
                controlButtons.forEach(button => button.disabled = false);
                loadingIndicator.classList.add('hidden');
            }
        }

        function displayMessage(type, message) {
            const panel = document.getElementById('message-panel');
            panel.textContent = message;
            
            // Clear existing classes
            panel.className = 'mt-4 p-3 rounded-lg text-sm';

            if (type === 'success') {
                panel.classList.add('bg-green-900/50', 'text-green-300');
            } else if (type === 'error') {
                panel.classList.add('bg-red-900/50', 'text-red-300');
            } else { // info
                panel.classList.add('bg-blue-900/50', 'text-blue-300');
            }
            panel.classList.remove('hidden');
            
            // Auto-hide success/info messages after a delay
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    panel.classList.add('hidden');
                }, 5000);
            }
        }


        // --- Status Update Logic ---
        function updateStatusBadge(status) {
            const statusElement = document.getElementById('server-status');
            const statusTextElement = document.getElementById('status-text');
            
            // Normalize status text for display
            const displayStatus = status.toUpperCase();

            statusTextElement.textContent = displayStatus;

            // Remove all color classes first
            statusElement.className = 'px-4 py-2 rounded-full text-sm font-semibold transition-colors duration-300 shadow-md';

            // Apply color based on the received status
            if (displayStatus === 'STARTED' || displayStatus === 'RUNNING' || displayStatus === 'ONLINE') {
                statusElement.classList.add('bg-green-600', 'text-white');
            } else if (displayStatus === 'STOPPING' || displayStatus === 'RESTARTING' || displayStatus === 'STARTING') {
                statusElement.classList.add('bg-yellow-600', 'text-gray-900');
            } else { // Includes STOPPED, OFF, UNKNOWN, anything else
                statusElement.classList.add('bg-red-600', 'text-white');
            }
        }


        // --- Details Rendering Logic ---
        function renderDetails(details) {
            const detailsOutput = document.getElementById('details-output');
            let htmlContent = '';

            // --- 1. Render Key/Value Sections (like INTERNET_IP) ---
            for (const sectionKey in details) {
                // The 'ports' key contains the simplified port data
                if (sectionKey === 'ports') {
                    continue; 
                }
                
                // Convert 'internet_ip' to 'Internet IP' for the header
                const headerText = sectionKey.replace(/_/g, ' ').toUpperCase();
                
                htmlContent += `<h3 class="text-xl font-bold text-pz-green mt-6 mb-3">${headerText}</h3>`;
                
                const sectionData = details[sectionKey];
                
                if (Object.keys(sectionData).length === 0) {
                    htmlContent += `<p class="text-gray-500 ml-4">No data available for this section.</p>`;
                } else {
                    htmlContent += `<div class="bg-gray-700/50 p-4 rounded-lg">`;
                    for (const key in sectionData) {
                        const value = sectionData[key];
                        const cleanKey = key.replace(/_/g, ' ');
                        htmlContent += `
                            <div class="flex justify-between py-1 border-b border-gray-700 last:border-b-0">
                                <span class="font-semibold text-gray-400 capitalize">${cleanKey}:</span>
                                <span class="text-white font-mono">${value}</span>
                            </div>
                        `;
                    }
                    htmlContent += `</div>`;
                }
            }
            
            // --- 2. Render Ports Table (Simplified) ---
            const ports = details.ports || [];
            if (ports.length > 0) {
                htmlContent += `
                    <h3 class="text-xl font-bold text-pz-green mt-6 mb-3">PORTS</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-700">
                            <thead>
                                <tr>
                                    <th class="px-2 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">DESCRIPTION</th>
                                    <th class="px-2 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">PORT</th>
                                    <th class="px-2 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">PROTOCOL</th>
                                    <th class="px-2 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">LISTEN</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800">
                `;
                
                ports.forEach(p => {
                    htmlContent += `
                        <tr>
                            <td class="px-2 py-2 whitespace-nowrap text-sm text-gray-300">${p.description}</td>
                            <td class="px-2 py-2 whitespace-nowrap text-sm text-white font-mono">${p.port}</td>
                            <td class="px-2 py-2 whitespace-nowrap text-sm text-gray-300">${p.protocol}</td>
                            <td class="px-2 py-2 whitespace-nowrap text-sm text-gray-300">${p.listen}</td>
                        </tr>
                    `;
                });
                
                htmlContent += `</tbody></table></div>`;
            } else {
                htmlContent += `<h3 class="text-xl font-bold text-pz-green mt-6 mb-3">PORTS</h3><p class="text-gray-500 ml-4">No port data available.</p>`;
            }

            detailsOutput.innerHTML = htmlContent;
        }


        // --- Function to fetch and render server details (GET) ---
        async function fetchDetails() {
            // Show loading state, but don't disable buttons for a simple refresh
            const loadingIndicator = document.getElementById('loading-indicator');
            loadingIndicator.textContent = "Fetching server details...";
            loadingIndicator.classList.remove('hidden');
            
            try {
                const response = await fetch('/api/details');
                const data = await response.json();
                
                loadingIndicator.classList.add('hidden');

                if (data.status === 'success') {
                    updateStatusBadge(data.server_status);
                    renderDetails(data.details);
                    displayMessage('info', data.message);

                } else {
                    updateStatusBadge('ERROR');
                    displayMessage('error', `API Error: ${data.message} - ${data.details.substring(0, 100)}...`);
                    document.getElementById('details-output').innerHTML = `<p class="text-red-400 p-4">API Error Details: ${data.details}</p>`;
                }

            } catch (error) {
                loadingIndicator.classList.add('hidden');
                updateStatusBadge('OFFLINE');
                displayMessage('error', `FATAL: Could not connect to API at port 5000. Is the Python app running?`);
            }
        }


        // --- Function to control server (POST) ---
        async function controlServer(action) {
            setActionLoading(action, true);
            displayMessage('info', `Attempting to send '${action}' command...`);
            
            try {
                const response = await fetch('/api/control', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action: action }),
                });

                const data = await response.json();

                if (data.status === 'success') {
                    displayMessage('success', `${action.toUpperCase()} command sent successfully! Refreshing status...`);
                    // Immediately fetch details after a control action
                    await fetchDetails(); 
                } else {
                    displayMessage('error', `Control failed for '${action}': ${data.message}. Details: ${data.details.substring(0, 100)}...`);
                }

            } catch (error) {
                displayMessage('error', `Network error during '${action}' command.`);
            } finally {
                setActionLoading(action, false);
            }
        }

    </script>
</body>
</html>
